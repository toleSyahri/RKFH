<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIM RUANG FH - Sistem Informasi Manajemen Ruangan</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .auth-card { max-width: 450px; margin: 50px auto; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
    .hidden { display: none !important; }
    .navbar-brand { font-weight: bold; letter-spacing: 1px; }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
      <a class="navbar-brand" href="#"><i class="fa-solid fa-building-columns me-2"></i>SIM RUANG FH</a>
      <div class="d-flex align-items-center">
        <span id="userGreeting" class="text-white me-3 hidden"></span>
        <button id="btnLogout" class="btn btn-outline-light btn-sm hidden" onclick="logout()"><i class="fa-solid fa-right-from-bracket me-1"></i>Keluar</button>
      </div>
    </div>
  </nav>

  <div class="container my-4">
    
    <!-- ALERT NOTIFIKASI -->
    <div id="alertBox" class="alert alert-dismissible fade show hidden" role="alert">
      <span id="alertMessage"></span>
      <button type="button" class="btn-close" onclick="hideAlert()"></button>
    </div>

    <!-- ========================================== -->
    <!-- SECTION 1: FORM LOGIN & REGISTRASI -->
    <!-- ========================================== -->
    <div id="authSection">
      <div class="card auth-card bg-white">
        <div class="card-body p-4">
          
          <!-- TAB NAVIGASI AUTH -->
          <ul class="nav nav-pills nav-justified mb-3" id="authTab">
            <li class="nav-item">
              <button class="nav-link active" onclick="switchAuthTab('login')">Masuk</button>
            </li>
            <li class="nav-item">
              <button class="nav-link" onclick="switchAuthTab('register')">Daftar</button>
            </li>
          </ul>

          <!-- FORM LOGIN -->
          <form id="formLogin" onsubmit="handleLogin(event)">
            <div class="mb-3">
              <label class="form-label">Username / NIM / Email</label>
              <input type="text" id="loginUsername" class="form-control" placeholder="Masukkan ID Akun" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Password</label>
              <input type="password" id="loginPassword" class="form-control" placeholder="Masukkan Password" required>
            </div>
            <button type="submit" id="btnLoginSubmit" class="btn btn-primary w-100">
              <span id="loginSpinner" class="spinner-border spinner-border-sm me-2 hidden"></span>Masuk
            </button>
          </form>

          <!-- FORM REGISTRASI -->
          <form id="formRegister" class="hidden" onsubmit="handleRegister(event)">
            <div class="mb-2">
              <label class="form-label">Nama Lengkap</label>
              <input type="text" id="regNama" class="form-control" placeholder="Nama Lengkap" required>
            </div>
            <div class="mb-2">
              <label class="form-label">Asal / Prodi</label>
              <input type="text" id="regProdi" class="form-control" placeholder="Contoh: S1 Ilmu Hukum" required>
            </div>
            <div class="mb-2">
              <label class="form-label">NIP / NIM</label>
              <input type="text" id="regNim" class="form-control" placeholder="Nomor Induk" required>
            </div>
            <div class="mb-2">
              <label class="form-label">No WhatsApp</label>
              <input type="text" id="regHp" class="form-control" placeholder="08123456789" required>
            </div>
            <div class="mb-2">
              <label class="form-label">Email</label>
              <input type="email" id="regEmail" class="form-control" placeholder="email@domain.com" required>
            </div>
            <div class="mb-2">
              <label class="form-label">Username</label>
              <input type="text" id="regUsername" class="form-control" placeholder="Username untuk login" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Password</label>
              <input type="password" id="regPassword" class="form-control" placeholder="Password" required>
            </div>
            <button type="submit" id="btnRegSubmit" class="btn btn-success w-100">
              <span id="regSpinner" class="spinner-border spinner-border-sm me-2 hidden"></span>Daftar Akun
            </button>
          </form>

        </div>
      </div>
    </div>

    <!-- ========================================== -->
    <!-- SECTION 2: DASHBOARD USER & PEMINJAMAN -->
    <!-- ========================================== -->
    <div id="mainDashboard" class="hidden">
      
      <!-- TAB NAVIGASI UTAMA -->
      <ul class="nav nav-tabs mb-4">
        <li class="nav-item">
          <button class="nav-link active" onclick="switchMainTab('rooms')"><i class="fa-solid fa-door-open me-2"></i>Daftar Ruangan</button>
        </li>
        <li class="nav-item">
          <button class="nav-link" onclick="switchMainTab('bookForm')"><i class="fa-solid fa-calendar-plus me-2"></i>Ajukan Peminjaman</button>
        </li>
        <li class="nav-item">
          <button class="nav-link" onclick="switchMainTab('myBookings')"><i class="fa-solid fa-clock-history me-2"></i>Status Peminjaman</button>
        </li>
      </ul>

      <!-- TAB 1: DAFTAR RUANGAN -->
      <div id="tabRooms">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h4>Ketersediaan Ruangan</h4>
          <button class="btn btn-outline-primary btn-sm" onclick="loadRooms()"><i class="fa-solid fa-rotate me-1"></i>Refresh</button>
        </div>
        <div class="table-responsive">
          <table class="table table-hover table-striped bg-white shadow-sm rounded">
            <thead class="table-dark">
              <tr>
                <th>Lantai</th>
                <th>Kode Ruang</th>
                <th>Fasilitas Kursi</th>
                <th>TV Smart</th>
                <th>AC</th>
                <th>Stop Kontak</th>
                <th>Papan Tulis</th>
                <th>Waktu Layanan</th>
              </tr>
            </thead>
            <tbody id="roomsTableBody">
              <tr><td colspan="8" class="text-center py-4">Memuat data ruangan...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- TAB 2: FORM AJUKAN PEMINJAMAN -->
      <div id="tabBookForm" class="hidden">
        <div class="card shadow-sm border-0">
          <div class="card-body">
            <h4 class="card-title mb-4">Formulir Peminjaman Ruangan</h4>
            <form onsubmit="handleBooking(event)">
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label">Pilih Ruangan</label>
                  <select id="bookRoomCode" class="form-select" required>
                    <option value="">-- Pilih Ruangan --</option>
                  </select>
                </div>
                <div class="col-md-6">
                  <label class="form-label">Tanggal Pinjam</label>
                  <input type="date" id="bookTanggal" class="form-control" required>
                </div>
                <div class="col-md-6">
                  <label class="form-label">Jam Mulai</label>
                  <input type="time" id="bookJamMulai" class="form-control" required>
                </div>
                <div class="col-md-6">
                  <label class="form-label">Jam Selesai</label>
                  <input type="time" id="bookJamSelesai" class="form-control" required>
                </div>
                <div class="col-12">
                  <label class="form-label">Keperluan / Kegiatan</label>
                  <textarea id="bookKeperluan" class="form-control" rows="3" placeholder="Jelaskan agenda/kegiatan secara rinci" required></textarea>
                </div>
                <div class="col-12">
                  <button type="submit" id="btnBookSubmit" class="btn btn-primary px-4">
                    <span id="bookSpinner" class="spinner-border spinner-border-sm me-2 hidden"></span>Kirim Pengajuan
                  </button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>

      <!-- TAB 3: STATUS PEMINJAMAN -->
      <div id="tabMyBookings" class="hidden">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h4>Riwayat Pengajuan Peminjaman</h4>
          <button class="btn btn-outline-primary btn-sm" onclick="loadBookings()"><i class="fa-solid fa-rotate me-1"></i>Refresh</button>
        </div>
        <div class="table-responsive">
          <table class="table table-bordered bg-white shadow-sm">
            <thead class="table-secondary">
              <tr>
                <th>Waktu Input</th>
                <th>Kode Ruang</th>
                <th>Pemohon</th>
                <th>NIM/NIP</th>
                <th>Tanggal</th>
                <th>Jam</th>
                <th>Keperluan</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="bookingsTableBody">
              <tr><td colspan="8" class="text-center py-4">Memuat data peminjaman...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>

  </div>

  <script>
    // =========================================================================
    // PASTEKAN URL WEB APP DEPLOYMENT GOOGLE APPS SCRIPT KAMU DI SINI
    // =========================================================================
    const API_URL = "https://script.google.com/macros/s/AKfycbwaJDJuSi6F6Z-lQycc3c3iW570d3b_zGqmgDRm-tbdeUuLXpTBGpqcgIKSmiUiOjtY/exec"; 

    let currentUser = null;

    // Helper untuk memanggil Backend Apps Script (JSONP Bypass CORS)
    function apiRequest(action, params = {}) {
      return new Promise((resolve, reject) => {
        const callbackName = 'jsonp_cb_' + Math.floor(Math.random() * 1000000);
        params.action = action;
        params.callback = callbackName;
        
        const queryString = Object.keys(params)
          .map(key => encodeURIComponent(key) + '=' + encodeURIComponent(params[key]))
          .join('&');
          
        const script = document.createElement('script');
        script.src = `${API_URL}?${queryString}`;
        
        window[callbackName] = function(data) {
          delete window[callbackName];
          document.body.removeChild(script);
          resolve(data);
        };
        
        script.onerror = function() {
          delete window[callbackName];
          document.body.removeChild(script);
          reject(new Error("Gagal terhubung ke Apps Script Backend!"));
        };
        
        document.body.appendChild(script);
      });
    }

    // UTILS NOTIFIKASI
    function showAlert(msg, type = "success") {
      const alertBox = document.getElementById('alertBox');
      const alertMessage = document.getElementById('alertMessage');
      alertBox.className = `alert alert-${type} alert-dismissible fade show`;
      alertMessage.innerText = msg;
      alertBox.classList.remove('hidden');
    }

    function hideAlert() {
      document.getElementById('alertBox').classList.add('hidden');
    }

    // NAVIGASI TAB AUTH
    function switchAuthTab(type) {
      hideAlert();
      const tabs = document.querySelectorAll('#authTab .nav-link');
      tabs[0].classList.toggle('active', type === 'login');
      tabs[1].classList.toggle('active', type === 'register');
      
      document.getElementById('formLogin').classList.toggle('hidden', type !== 'login');
      document.getElementById('formRegister').classList.toggle('hidden', type !== 'register');
    }

    // NAVIGASI TAB UTAMA
    function switchMainTab(tabName) {
      document.getElementById('tabRooms').classList.toggle('hidden', tabName !== 'rooms');
      document.getElementById('tabBookForm').classList.toggle('hidden', tabName !== 'bookForm');
      document.getElementById('tabMyBookings').classList.toggle('hidden', tabName !== 'myBookings');
      
      const links = document.querySelectorAll('#mainDashboard .nav-link');
      links[0].classList.toggle('active', tabName === 'rooms');
      links[1].classList.toggle('active', tabName === 'bookForm');
      links[2].classList.toggle('active', tabName === 'myBookings');

      if (tabName === 'rooms') loadRooms();
      if (tabName === 'myBookings') loadBookings();
    }

    // HANDLE LOGIN
    async function handleLogin(e) {
      e.preventDefault();
      hideAlert();
      
      const username = document.getElementById('loginUsername').value.trim();
      const password = document.getElementById('loginPassword').value.trim();

      document.getElementById('loginSpinner').classList.remove('hidden');
      document.getElementById('btnLoginSubmit').disabled = true;

      try {
        const res = await apiRequest('loginUser', { username, password });
        if (res.status === 'success') {
          currentUser = res.user;
          showAlert(`Selamat datang, ${currentUser.nama}!`, 'success');
          
          document.getElementById('authSection').classList.add('hidden');
          document.getElementById('mainDashboard').classList.remove('hidden');
          document.getElementById('userGreeting').classList.remove('hidden');
          document.getElementById('userGreeting').innerText = `Halo, ${currentUser.nama}`;
          document.getElementById('btnLogout').classList.remove('hidden');
          
          loadRooms();
        } else {
          showAlert(res.message, 'danger');
        }
      } catch (err) {
        showAlert(err.message, 'danger');
      } finally {
        document.getElementById('loginSpinner').classList.add('hidden');
        document.getElementById('btnLoginSubmit').disabled = false;
      }
    }

    // HANDLE REGISTRASI
    async function handleRegister(e) {
      e.preventDefault();
      hideAlert();

      const params = {
        nama: document.getElementById('regNama').value.trim(),
        prodi: document.getElementById('regProdi').value.trim(),
        nim: document.getElementById('regNim').value.trim(),
        hp: document.getElementById('regHp').value.trim(),
        email: document.getElementById('regEmail').value.trim(),
        username: document.getElementById('regUsername').value.trim(),
        password: document.getElementById('regPassword').value.trim()
      };

      document.getElementById('regSpinner').classList.remove('hidden');
      document.getElementById('btnRegSubmit').disabled = true;

      try {
        const res = await apiRequest('registerUser', params);
        if (res.status === 'success') {
          showAlert(res.message, 'success');
          document.getElementById('formRegister').reset();
          switchAuthTab('login');
        } else {
          showAlert(res.message, 'danger');
        }
      } catch (err) {
        showAlert(err.message, 'danger');
      } finally {
        document.getElementById('regSpinner').classList.add('hidden');
        document.getElementById('btnRegSubmit').disabled = false;
      }
    }

    // LOAD DATA RUANGAN
    async function loadRooms() {
      const tbody = document.getElementById('roomsTableBody');
      const selectRoom = document.getElementById('bookRoomCode');
      
      try {
        const res = await apiRequest('getRooms');
        if (res.status === 'success') {
          tbody.innerHTML = '';
          selectRoom.innerHTML = '<option value="">-- Pilih Ruangan --</option>';

          if (res.data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="8" class="text-center">Belum ada data ruangan.</td></tr>';
            return;
          }

          res.data.forEach(room => {
            tbody.innerHTML += `
              <tr>
                <td>${room.lantai}</td>
                <td><strong>${room.code}</strong></td>
                <td>${room.kursi}</td>
                <td>${room.tvSmart}</td>
                <td>${room.ac}</td>
                <td>${room.stopKontak}</td>
                <td>${room.papanTulis}</td>
                <td>${room.waktuLayanan}</td>
              </tr>
            `;

            selectRoom.innerHTML += `<option value="${room.code}">${room.code} (Lantai ${room.lantai})</option>`;
          });
        }
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="8" class="text-center text-danger">Gagal memuat ruangan: ${err.message}</td></tr>`;
      }
    }

    // HANDLE AJUKAN PEMINJAMAN
    async function handleBooking(e) {
      e.preventDefault();
      hideAlert();

      const params = {
        roomCode: document.getElementById('bookRoomCode').value,
        nama: currentUser.nama,
        nim: currentUser.nim,
        hp: currentUser.hp,
        keperluan: document.getElementById('bookKeperluan').value.trim(),
        tanggal: document.getElementById('bookTanggal').value,
        jamMulai: document.getElementById('bookJamMulai').value,
        jamSelesai: document.getElementById('bookJamSelesai').value
      };

      document.getElementById('bookSpinner').classList.remove('hidden');
      document.getElementById('btnBookSubmit').disabled = true;

      try {
        const res = await apiRequest('addBooking', params);
        if (res.status === 'success') {
          showAlert(res.message, 'success');
          e.target.reset();
          switchMainTab('myBookings');
        } else {
          showAlert(res.message, 'danger');
        }
      } catch (err) {
        showAlert(err.message, 'danger');
      } finally {
        document.getElementById('bookSpinner').classList.add('hidden');
        document.getElementById('btnBookSubmit').disabled = false;
      }
    }

    // LOAD DATA PEMINJAMAN
    async function loadBookings() {
      const tbody = document.getElementById('bookingsTableBody');
      try {
        const res = await apiRequest('getBookings');
        if (res.status === 'success') {
          tbody.innerHTML = '';
          if (res.data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="8" class="text-center">Belum ada riwayat peminjaman.</td></tr>';
            return;
          }

          res.data.forEach(item => {
            let badgeClass = 'bg-warning text-dark';
            if (item.status === 'Disetujui') badgeClass = 'bg-success';
            if (item.status === 'Ditolak') badgeClass = 'bg-danger';

            tbody.innerHTML += `
              <tr>
                <td>${item.waktuInput}</td>
                <td><strong>${item.roomCode}</strong></td>
                <td>${item.pemohon}</td>
                <td>${item.nim}</td>
                <td>${item.tanggal}</td>
                <td>${item.jam}</td>
                <td>${item.keperluan}</td>
                <td><span class="badge ${badgeClass}">${item.status}</span></td>
              </tr>
            `;
          });
        }
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="8" class="text-center text-danger">Gagal memuat peminjaman: ${err.message}</td></tr>`;
      }
    }

    // LOGOUT
    function logout() {
      currentUser = null;
      document.getElementById('authSection').classList.remove('hidden');
      document.getElementById('mainDashboard').classList.add('hidden');
      document.getElementById('userGreeting').classList.add('hidden');
      document.getElementById('btnLogout').classList.add('hidden');
      document.getElementById('formLogin').reset();
      switchAuthTab('login');
      showAlert('Anda berhasil keluar.', 'info');
    }
  </script>
</body>
</html>
